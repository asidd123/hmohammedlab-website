name: Update publications

on:
  schedule:
    # 09:00 UTC every Monday
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch publications and regenerate data file
        run: python3 scripts/update_publications.py

      - name: Commit changes if any
        run: |
          if git diff --quiet -- js/publications-data.js; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/publications-data.js
          git commit -m "Update publications from Semantic Scholar"
          git push
